# Does this package build for someone who installed Beans the normal way?
#
# Every gate in this repo resolves the compiler as $BEANSC, then
# $BEANS_ROOT/build/beansc, then ../../beans/build/beansc, then PATH. In the
# workspace layout every developer has, the third one always hits, so test.sh
# ran against a compiler built from beans main and was green on every machine
# that had one — and on none of their users'. That is how beans-lang/espresso#9
# shipped: main called three std entry points that exist in no release, and no
# gate could see it, because no gate ever used a release.
#
# This job removes the tree-built compiler from the picture. It installs the
# latest published release with the release install script — the same one the
# beans CI boots from, and the same one the README tells a user to run — and
# then runs test.sh with nothing pointing at a checkout. If it passes, main is
# installable. If it fails, main is not, and that is worth a red mark.
#
# ---------------------------------------------------------------------------
# THIS JOB IS EXPECTED TO FAIL RIGHT NOW, AND THE FAILURE IS THE TRUE ANSWER.
#
# main calls http.encode_response_head_append, TcpStream.write_vectored and
# TcpStream.write_vectored_text. All three land in beans-lang/beans#148, merged
# 2026-09-07; the newest release, 0.1.39, was tagged 2026-09-06 and carries
# none of them. So the checker stops on server.b with eight errors, and will
# keep stopping until the Beans release carrying #148 is cut.
#
# It is red because the repository is in a red state, not because the check is
# broken. It turns green by itself on the day that release ships — which is
# also the signal that this package's documented floor can name a version
# again (README "Versioning", CHANGELOG "Requirements"). The schedule below
# exists for exactly that: the flip to green does not need anyone to open a PR.
#
# When it goes green, delete this block down to the line above the trigger and
# leave the job. Do not delete the job to make the tab green.
# ---------------------------------------------------------------------------
#
# The native leg (test.sh --native) is deliberately not here. It runs
# rss_gate.sh, whose pass mark is a resident-memory threshold tuned against a
# target that #148 itself moves; a threshold miss on a shared runner would make
# this job red for a reason that has nothing to do with installability, which
# is the one thing it is here to answer. It belongs in a separate job once the
# floor is a real release and the threshold is settled.

name: published toolchain

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    # Daily, so the day the Beans release lands this flips to green on its own.
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: published-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: install the release, run the suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # test.sh needs no C toolchain for the interpreter leg or the
      # cross-target checks, but an installed beansc that decides it wants one
      # must not fail this job for the wrong reason.
      - name: Install a C toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm

      # The user's install path, verbatim. No fallback to a checkout, and no
      # `|| true`: if this cannot install a compiler, the job fails here. A
      # gate that skips when its input is missing is worse than no gate — it
      # goes quiet exactly when something has moved.
      - name: Install the latest published Beans
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/beans-lang/beans/releases/latest/download/beans-install.sh | sh
          echo "$HOME/.beans/bin" >> "$GITHUB_PATH"

      - name: The compiler under test
        run: |
          set -euo pipefail
          command -v beansc
          beansc --version

      # BEANS_ROOT and BEANSC are cleared so test.sh's resolution order falls
      # all the way through to PATH, which is where the installed release is.
      # A checkout of this repo alone has no ../../beans, but clearing them
      # says so on purpose rather than by luck.
      - name: Run the suite
        env:
          BEANS_ROOT: ""
          BEANSC: ""
        run: ./test.sh
